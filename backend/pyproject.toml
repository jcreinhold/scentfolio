[project]
name = "scentfolio-backend"
version = "0.0.0"
requires-python = ">=3.14,<3.16"
dependencies = [
    "fastapi==0.115.*",
    "httpx2>=2.16,<3",
    "pydantic==2.*",
    "pydantic-ai-slim[anthropic,openai]==2.70.*",
    "python-dotenv==1.*",
    "sqlalchemy==2.0.*",
    "uvicorn[standard]==0.32.*",
]

[dependency-groups]
dev = [
    "httpx==0.27.*",
    "pytest==8.*",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = [
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "PERF", # perflint
  "PL",   # pylint
  "PTH",  # flake8-use-pathlib
  "RUF",  # ruff-specific rules
  "SIM",  # flake8-simplify
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
  "FAST", # fastapi
]
