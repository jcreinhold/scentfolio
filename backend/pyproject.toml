[project]
name = "scentfolio-backend"
version = "0.0.0"
requires-python = ">=3.14,<3.16"
dependencies = [
    "anthropic>=0.116,<1.0",
    "fastapi==0.115.*",
    "pydantic==2.*",
    "python-dotenv==1.*",
    "sqlalchemy==2.0.*",
    "uvicorn[standard]==0.32.*",
]

[dependency-groups]
dev = [
    "httpx==0.27.*",
    "pytest==8.*",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
